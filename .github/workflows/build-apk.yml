name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated, so the repo only needs the app code.
      # Existing files (lib/, pubspec.yaml, ...) are left untouched.
      - name: Create Android project files
        run: flutter create --platforms=android --project-name doc_scanner --org com.example .

      - name: Configure AndroidManifest
        run: dart run tool/setup_android.dart

      - run: flutter pub get

      # Warnings and errors fail the build; style hints (infos) do not.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Debug builds skip Android's code shrinker (R8). If scanning works in
      # this APK but not in the release one, the shrinker is breaking the
      # scanner library.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
