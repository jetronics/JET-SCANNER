name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        # Plain "bash" turns on pipefail, so a failing command is not hidden
        # by the "| tee" that copies its output into build.log.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version 2>&1 | tee -a build.log

      # The android/ folder is generated, so the repo only needs the app code.
      # Existing files (lib/, pubspec.yaml, ...) are left untouched.
      - name: Create Android project files
        run: flutter create --platforms=android --project-name doc_scanner --org com.example . 2>&1 | tee -a build.log

      - name: Configure the Android project
        run: dart run tool/setup_android.dart 2>&1 | tee -a build.log

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log

      # Real errors stop the build here. Warnings and style hints are shown in
      # the log but do not block the APK.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      # A failing test shows up as a warning but does not stop the APK build.
      - name: Test
        run: flutter test 2>&1 | tee -a build.log
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # A debug build skips Android's code shrinker, so it is a useful fallback
      # if the release build ever misbehaves on a phone.
      - name: Build debug APK
        run: flutter build apk --debug 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: doc-scanner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # If anything above failed, put the end of the log on the run's summary
      # page so the real error is visible without opening the step logs.
      - name: Show the error on the summary page
        if: failure()
        run: |
          {
            echo '### The build failed. End of the log:'
            echo '```'
            tail -n 120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
